spring.config.import=optional:file:./.local/application-local.properties
spring.application.name=nexum-local
server.address=127.0.0.1
server.port=8086
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/nexum_herramientas_local
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
jwt.secret=${JWT_SECRET}
jwt.expiration-minutes=60
cors.allowed-origins=http://127.0.0.1:4306,http://localhost:4306

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=102MB

# Correo de verificación: configurar con variables del entorno, sin guardar claves en el código.
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${SMTP_FROM:}

# Direccion publica del frontend utilizada en enlaces de recuperacion.
app.frontend-url=${FRONTEND_URL:http://127.0.0.1:4306}
